name: Build packages (parallel)

on:
  push:
    paths:
      - 'config/**'
      - 'lists/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'Makefile'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # One job per architecture, each on a runner of that architecture.
  #
  # This used to be a single self-hosted x86 job building BOTH arches, with
  # aarch64 running under qemu-user-static. GitHub gives public repos free native
  # arm64 runners (ubuntu-24.04-arm), which build-single.yml already uses, so
  # each arch now compiles natively: no emulation, and the two run in parallel.
  #
  # Fitting a GitHub-hosted runner (4 vCPU / 16 GB / ~14 GB disk / 6 h):
  #   - Splitting by arch halves the output per job (~2.4 GB instead of ~4.8 GB).
  #   - recompile.sh sizes its own parallelism from MemAvailable and nproc
  #     (MEM_GB/6, capped at nproc/2), so it self-limits to ~2 jobs here rather
  #     than the 6/arch it picks on a big box. No OOM, no tuning needed.
  #   - The old job spent ~47 min building both arches on 12 cores, then ~18 min
  #     uploading a single ~5 GB artifact. Per-arch artifacts are ~2.4 GB and
  #     upload concurrently.
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: build-x86
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: build-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v5

      # qemu-user-static is deliberately absent: each arch builds on its own
      # native runner, so there is nothing to emulate.
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
              clang mold ninja-build cmake meson autoconf automake \
              dpkg-dev devscripts fakeroot build-essential \
              curl ca-certificates git file openssl \
              libzstd-dev libssl-dev zlib1g-dev pkg-config

      # apk.static must match the runner's architecture -- this URL was hardcoded
      # to x86_64, which would install an x86 binary on the arm64 runner.
      - name: Install apk-tools
        run: |
          curl -fsSL \
              "https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic//v3.0.5/${{ matrix.arch }}/apk.static" \
              -o /usr/local/bin/apk
          chmod +x /usr/local/bin/apk

      - name: Fix apt sandbox
        run: |
          echo 'APT::Sandbox::User "root";' > /etc/apt/apt.conf.d/99sandbox
          mkdir -p /var/lib/apt/lists/partial
          chown -R _apt:root /var/lib/apt/lists 2>/dev/null || true
          chmod 755 /var/lib/apt/lists

      - name: Enable deb-src
        run: |
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          elif [ -f /etc/apt/sources.list ]; then
            grep '^deb ' /etc/apt/sources.list | sed 's/^deb /deb-src /' >> /etc/apt/sources.list
          fi
          apt-get update -qq

      - name: Setup signing keys
        run: |
          set -eu
          mkdir -p /tmp/silex-keys /etc/apk/keys
          printf '%s' "$SILEX_PKG_RSA" > /tmp/silex-keys/silex-packages.rsa
          chmod 600 /tmp/silex-keys/silex-packages.rsa
          # DERIVE the public key from the private one rather than reading a
          # second secret. The pub half is not independent information, and the
          # secret that used to supply it is named SILEX_PKGS_RSA_PUB while
          # every reference here said SILEX_PKG_RSA_PUB -- so the expansion was
          # the empty string and this wrote a 0-byte "public key". That went
          # unnoticed only because the Pages step copies the committed
          # keys/-69c32c6d.rsa.pub by name and never reads this file.
          # Deriving cannot drift from the signing key by construction.
          openssl rsa -in /tmp/silex-keys/silex-packages.rsa -pubout \
                  -out /tmp/silex-keys/silex-packages.rsa.pub 2>/dev/null
          test -s /tmp/silex-keys/silex-packages.rsa.pub
          cp /tmp/silex-keys/silex-packages.rsa.pub /etc/apk/keys/
          cp /tmp/silex-keys/silex-packages.rsa.pub keys/
        env:
          SILEX_PKG_RSA: ${{ secrets.SILEX_PKG_RSA }}

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # `make -j 32` was sized for a 12-core box. It is not what parallelises the
      # work anyway: repack backgrounds its 12 chunks itself and recompile.sh
      # picks its own job count from the runner's memory, so a modest -j here
      # only bounds make's own target-level concurrency.
      - name: Build ${{ matrix.arch }}
        run: make -j 4 ${{ matrix.target }}
        env:
          PRIVKEY: /tmp/silex-keys/silex-packages.rsa
          PUBKEY:  /tmp/silex-keys/silex-packages.rsa.pub

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: silex-packages-${{ matrix.arch }}
          path: ${{ matrix.arch }}/

  # Signing is index-only and cheap, so it needs no self-hosted capacity. It runs
  # on a GitHub-hosted runner and pulls each arch's artifact back into its own
  # directory (the build jobs now upload one artifact per arch).
  sign-indexes:
    name: Sign APKINDEXes
    needs: build
    runs-on: ubuntu-latest
    container:
      image: alpine:3.23
    steps:
      - uses: actions/checkout@v5

      - name: Install signing tools
        run: apk add --no-cache openssl abuild git

      # Downloaded per-arch and into an explicit path: upload-artifact roots the
      # archive at the uploaded directory, so the arch prefix has to be restored
      # here or both arches would collide at the workspace root.
      - name: Download x86_64 packages
        uses: actions/download-artifact@v5
        with:
          name: silex-packages-x86_64
          path: x86_64

      - name: Download aarch64 packages
        uses: actions/download-artifact@v5
        with:
          name: silex-packages-aarch64
          path: aarch64

      - name: Setup signing keys
        run: |
          set -eu
          mkdir -p /tmp/silex-keys /etc/apk/keys
          printf '%s' "$SILEX_PKG_RSA" > /tmp/silex-keys/silex-packages.rsa
          chmod 600 /tmp/silex-keys/silex-packages.rsa
          # DERIVE the public key from the private one rather than reading a
          # second secret. The pub half is not independent information, and the
          # secret that used to supply it is named SILEX_PKGS_RSA_PUB while
          # every reference here said SILEX_PKG_RSA_PUB -- so the expansion was
          # the empty string and this wrote a 0-byte "public key". That went
          # unnoticed only because the Pages step copies the committed
          # keys/-69c32c6d.rsa.pub by name and never reads this file.
          # Deriving cannot drift from the signing key by construction.
          openssl rsa -in /tmp/silex-keys/silex-packages.rsa -pubout \
                  -out /tmp/silex-keys/silex-packages.rsa.pub 2>/dev/null
          test -s /tmp/silex-keys/silex-packages.rsa.pub
          cp /tmp/silex-keys/silex-packages.rsa.pub /etc/apk/keys/
          cp /tmp/silex-keys/silex-packages.rsa.pub keys/
        env:
          SILEX_PKG_RSA: ${{ secrets.SILEX_PKG_RSA }}

      - name: Sign APKINDEXes
        run: |
          for arch in x86_64 aarch64; do
            abuild-sign -k /tmp/silex-keys/silex-packages.rsa "$arch/APKINDEX.tar.gz" &
          done
          wait
          echo "✓ Signing complete"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v5
        with:
          name: silex-packages-signed
          path: |
            x86_64/APKINDEX.tar.gz*
            aarch64/APKINDEX.tar.gz*

      - name: Prepare Pages content
        run: |
          set -eu
          mkdir -p _pages/keys
          cp -r x86_64 _pages/
          cp -r aarch64 _pages/
          # Publish the repo public key at the path the README documents, under
          # the name the signed index references (.SIGN.RSA.silex-packages.rsa.pub).
          # apk looks a key up BY THE NAME IN THE SIGNATURE, so the served and
          # installed filename must be silex-packages.rsa.pub -- not the
          # keyid-style name it is stored under in git. Until now this URL 404'd,
          # so the README's setup snippet could not work for anyone outside the
          # SDK image (which bakes the key in).
          cp keys/-69c32c6d.rsa.pub _pages/keys/silex-packages.rsa.pub

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: sign-indexes
    runs-on: ubuntu-latest
    if: success()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
